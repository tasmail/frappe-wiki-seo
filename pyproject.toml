[project]
name = "wiki_seo"
authors = [{ name = "FOSS-On-Line", email = "foss@foss.ua" }]
description = "Server-side SEO for Frappe Wiki pages: lang, hreflang, title suffix and X-Robots-Tag through an after_request hook"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Declared for bench, not as a pip dependency: pip could resolve the wrong `frappe` package from PyPI.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["wiki_seo"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
